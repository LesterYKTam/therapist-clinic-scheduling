services:
  postgres-dev:
    image: postgres:17-alpine
    container_name: clinic-postgres-dev
    env_file:
      - ./.local/dev.env
    ports:
      - "5432:5432"
    volumes:
      - clinic_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    container_name: clinic-postgres-test
    env_file:
      - ./.local/test.env
    ports:
      - "5433:5432"
    volumes:
      - clinic_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clinic_postgres_dev_data:
  clinic_postgres_test_data:
