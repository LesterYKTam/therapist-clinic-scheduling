.cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface-page);font-family:var(--font-sans)}
.cover svg{position:absolute;inset:0}
.primary{fill:var(--primary)} .ink{fill:var(--ink)} .subtle{fill:var(--primary-subtle)} .sunken{fill:var(--surface-sunken)}
.tile{rx:var(--radius-sm)}
.status-staged-bg{fill:var(--status-staged-bg)}
.surface-card{fill:var(--surface-card);stroke:var(--border-subtle)}
.status-conflict-bg{fill:var(--status-conflict-bg)}
.primary-subtle{fill:var(--primary-subtle)}
.txt{position:absolute;left:40px;bottom:32px;max-width:440px}
.name{margin:0;font-size:80px;line-height:.95;font-weight:700;letter-spacing:-0.02em;color:var(--ink)}
.tag{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted)}
